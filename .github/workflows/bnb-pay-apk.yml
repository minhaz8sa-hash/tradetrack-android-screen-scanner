name: Build BNB PAY APK

on:
  workflow_dispatch:
  push:
    branches: [bnb-pay-v1]
    paths:
      - 'bnb-pay-apk/**'
      - '.github/workflows/bnb-pay-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: bnb-pay-apk
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bnb-pay-apk
          path: bnb-pay-apk/app/build/outputs/apk/debug/app-debug.apk
