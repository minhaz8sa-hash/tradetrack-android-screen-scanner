name: Build Tigers71 APK
on:
  push:
    paths:
      - "tiger71-android/**"
      - ".github/workflows/build-tiger71-apk.yml"
  pull_request:
    paths:
      - "tiger71-android/**"
      - ".github/workflows/build-tiger71-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiger71-android
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK and install Android 35 if necessary
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          command -v sdkmanager
          if [ ! -d "${ANDROID_HOME}/platforms/android-35" ]; then
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Tigers71-Esports-Android-v1.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tigers71-Esports-Debug-APK
          path: Tigers71-Esports-Android-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
