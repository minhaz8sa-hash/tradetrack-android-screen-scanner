name: Namaz Orbit APK

on:
  push:
    branches: [main]
    paths:
      - 'namaz-reminder/**'
      - '.github/workflows/namaz-reminder-apk.yml'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: namaz-reminder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check v1.4.1 JavaScript syntax
        run: |
          node --check web/app7.js
          node --check web/app8.js
          node --check web/app9.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: namaz-orbit-stable-debug-key-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Namaz-Orbit-v1.4.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Orbit-v1.4.1
          path: namaz-reminder/Namaz-Orbit-v1.4.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete v1.4.1 --yes || true
          git tag -d v1.4.1 2>/dev/null || true
          git push origin :refs/tags/v1.4.1 2>/dev/null || true
          gh release create v1.4.1 Namaz-Orbit-v1.4.1.apk --target main --title "Namaz Orbit v1.4.1" --notes "Merged Prayer and Calendar into Home, larger interactive Qibla orbit, Qaza red-dot quick completion, top next-prayer countdown, compact live location, Guide navbar, plus prior v1.3 features."
