name: Namaz Orbit APK

on:
  push:
    branches: [main]
    paths:
      - 'namaz-reminder/RELEASE'
  workflow_dispatch:


concurrency:
  group: namaz-orbit-apk-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: namaz-reminder
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check v2.0.0 JavaScript syntax
        run: |
          node --check web/app1.js
          node --check web/app2.js
          node --check web/app4.js
          node --check web/app5.js
          node --check web/app7.js
          node --check web/app9.js
          node --check web/app10.js
          node --check web/app11.js
          node --check web/app12.js
          node --check web/app13.js
          node --check web/app14.js
          node --check web/app15.js
          node --check web/app16.js
          node --check web/app17.js
          node --check web/app18.js
          node --check web/app19.js
          node --check web/app20.js
          node --check web/app21.js
          node --check web/api/leaderboard.js
          node --check web/api/mosques.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: namaz-orbit-stable-debug-key-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Namaz-Orbit-v2.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Orbit-v2.0.0
          path: namaz-reminder/Namaz-Orbit-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete v2.0.0 --yes || true
          git tag -d v2.0.0 2>/dev/null || true
          git push origin :refs/tags/v2.0.0 2>/dev/null || true
          gh release create v2.0.0 Namaz-Orbit-v2.0.0.apk --target main --title "Namaz Orbit v2.0.0" --notes "v2.0.0: Quran assistive Bangla pronunciation, reliable Backup/Restore plus Android backup rules, automatic in-app Dhikr floating circle with animated progress ring, system overlay progress ring, Google Maps mosque search, shared registered mosque schedules, hidden server-authenticated Mosque Administration, mosque image/Azan/Jamaat/Jummah/Eid/announcement publishing, and selected-mosque Azan/Jamaat alerts."
