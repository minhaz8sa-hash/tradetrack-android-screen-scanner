name: Build BNB PAY Demo APK

on:
  pull_request:
    branches: [bnb-pay-ci]
    paths:
      - "bnb-pay-apk/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bnb-pay-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 10 || true
      - name: Build demo APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BNB-PAY-Demo-APK
          path: bnb-pay-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
