name: Publish TT Intelligence Engine

on:
  workflow_dispatch:
  push:
    branches: [tt-scan-v2-engine]
    paths:
      - "tt-intelligence-engine/**"
      - ".github/workflows/publish-tt-engine.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./tt-intelligence-engine
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tt-intelligence-engine:v2
            ghcr.io/${{ github.repository_owner }}/tt-intelligence-engine:${{ github.sha }}
